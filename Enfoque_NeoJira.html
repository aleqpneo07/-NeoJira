      const SPANISH_MONTHS = [

        'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre',

      const SPANISH_MONTHS_SHORT = [
        'ene', 'feb', 'mar', 'abr', 'may', 'jun',
        'jul', 'ago', 'sep', 'oct', 'nov', 'dic',
      ];

      const WEEKDAYS_SHORT = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

      function getTodayIsoString() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function addDaysIso(baseIso, days) {
        const [y, m, d] = baseIso.split('-').map(Number);
        const dt = new Date(Date.UTC(y, (m || 1) - 1, (d || 1) + days));
        return `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}-${String(dt.getUTCDate()).padStart(2, '0')}`;
      }

      function makeSafeId(prefix) {
        return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      }

      function calculateTaskProgress(subtasks, fallbackStatus) {
        const totalSubtasks = Math.min(subtasks.length, 50);
        if (totalSubtasks === 0) {
          const fallbackProgress =
            fallbackStatus === 'terminado' ? 100 : fallbackStatus === 'en_marcha' ? 50 : 0;
          return { progress: fallbackProgress, totalSubtasks: 0, completedSubtasks: 0 };
        }
        const completedSubtasks = subtasks.slice(0, totalSubtasks).filter((s) => s.completed).length;
        const progress = Math.round((completedSubtasks / totalSubtasks) * 100);
        return { progress, totalSubtasks, completedSubtasks };
      }

      function formatSpanishDate(isoDate, todayIso) {
        if (!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(isoDate)) {
          return {
            fullDate: isoDate,
            shortLabel: isoDate,
            isToday: false,
            isTomorrow: false,
            isOverdue: false,
            isThisWeek: false,
            diffDays: 99,
          };
        }
        const [y, m, d] = isoDate.split('-').map(Number);
        const [ty, tm, td] = todayIso.split('-').map(Number);
        const diffDays = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(ty, tm - 1, td)) / 86400000);
        const fullDate = `${d} de ${SPANISH_MONTHS[(m - 1 + 12) % 12]}, ${y}`;
        const isToday = diffDays === 0;
        const isTomorrow = diffDays === 1;
        const isOverdue = diffDays < 0;
        const isThisWeek = diffDays >= 0 && diffDays <= 7;

        let shortLabel = `${d} ${SPANISH_MONTHS_SHORT[(m - 1 + 12) % 12]}`;
        if (isToday) shortLabel = 'Entrega hoy';
        else if (isTomorrow) shortLabel = 'Mañana';
        else if (isOverdue) shortLabel = `Hace ${Math.abs(diffDays)} d`;

        return { fullDate, shortLabel, isToday, isTomorrow, isOverdue, isThisWeek, diffDays };
      }

      function getCalendarMonthDays(year, monthIndex, todayIso) {
        const firstOfMonth = new Date(Date.UTC(year, monthIndex, 1));
        const startDayOfWeek = (firstOfMonth.getUTCDay() + 6) % 7;
        const daysInMonth = new Date(Date.UTC(year, monthIndex + 1, 0)).getUTCDate();
        const totalCells = Math.ceil((startDayOfWeek + daysInMonth) / 7) * 7;
        const cells = [];

        for (let i = 0; i < totalCells; i++) {
          const dayOffset = i - startDayOfWeek + 1;
          const dt = new Date(Date.UTC(year, monthIndex, dayOffset));
          const isoDate = `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}-${String(dt.getUTCDate()).padStart(2, '0')}`;
          cells.push({
            isoDate,
            dayNumber: dt.getUTCDate(),
            isCurrentMonth: dt.getUTCMonth() === monthIndex,
            isToday: isoDate === todayIso,
          });
        }
        return cells;
      }

      function cycleScheduleLabel(current) {
        const order = ['', 'En curso', 'Hoy', 'Mañana'];
        const idx = order.indexOf(current);
        return order[(idx + 1) % order.length];

          { id: 'sub-alg-2', ownerId, taskId: 'task-examen-algoritmos', title: 'Árboles equilibrados y grafos (Dijkstra / BFS)', completed: false, scheduleLabel: 'En curso', sortOrder: 2 },

      function App() {
        const [todayIso, setTodayIso] = useState(() => getTodayIsoString());
        const searchInputRef = useRef(null);
        const fileInputRef = useRef(null);

        const [tasks, setTasks] = useState(() => {
          try {
            const saved = localStorage.getItem(LOCAL_STORAGE_TASKS_KEY);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch {}
          return getInitialSeedData(getTodayIsoString()).tasks;
        });

        const [subtasks, setSubtasks] = useState(() => {
          try {
            const saved = localStorage.getItem(LOCAL_STORAGE_SUBTASKS_KEY);
            if (saved) {
              const parsed = JSON.parse(saved);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          } catch {}
          return getInitialSeedData(getTodayIsoString()).subtasks;
        });

        const [activeFilter, setActiveFilter] = useState('todo');
        const [searchQuery, setSearchQuery] = useState('');
        const [viewMode, setViewMode] = useState('tablero');
        const [sortBy, setSortBy] = useState('fecha');
        const [selectedTaskId, setSelectedTaskId] = useState('task-estudio-lumen');
        const [isMobileDrawerOpen, setIsMobileDrawerOpen] = useState(false);
        const [mobileStatusTab, setMobileStatusTab] = useState('todos');

        // Modals
        const [isTaskModalOpen, setIsTaskModalOpen] = useState(false);
        const [editingTask, setEditingTask] = useState(null);
        const [modalDefaultStatus, setModalDefaultStatus] = useState('pendiente');
        const [modalDefaultDueDate, setModalDefaultDueDate] = useState('');
        const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);

        // Inspector local state
        const [newSubtaskTitle, setNewSubtaskTitle] = useState('');
        const [newSubtaskSchedule, setNewSubtaskSchedule] = useState('En curso');
        const [isEditingDate, setIsEditingDate] = useState(false);
        const [confirmDelete, setConfirmDelete] = useState(false);
        const [editingSubtaskId, setEditingSubtaskId] = useState(null);
        const [editingSubtaskText, setEditingSubtaskText] = useState('');

        // Drag & Drop state (Mouse + Touch for Tablet & Mobile)
        const [draggedTaskId, setDraggedTaskId] = useState(null);
        const [dragOverColumn, setDragOverColumn] = useState(null);
        const [touchDragGhost, setTouchDragGhost] = useState(null);

        const longPressTimerRef = useRef(null);
        const touchStartPosRef = useRef(null);
        const activeTouchTaskRef = useRef(null);
        const dragOverColumnRef = useRef(null);

        const clearLongPressTimer = () => {
          if (longPressTimerRef.current !== null) {
            window.clearTimeout(longPressTimerRef.current);
            longPressTimerRef.current = null;
          }
        };

        const beginTouchDrag = (task, clientX, clientY) => {
          clearLongPressTimer();
          activeTouchTaskRef.current = { id: task.id, title: task.title };
          setDraggedTaskId(task.id);
          setTouchDragGhost({
            taskId: task.id,
            title: task.title,
            x: clientX,
            y: clientY,
          });
          if (typeof navigator !== 'undefined' && navigator.vibrate) {
            try {
              navigator.vibrate(15);
            } catch {}
          }
        };

        // Calendar state
        const [calYear, setCalYear] = useState(() => Number(todayIso.split('-')[0]));
        const [calMonth, setCalMonth] = useState(() => Number(todayIso.split('-')[1]) - 1);
        const [selectedCalDate, setSelectedCalDate] = useState(todayIso);

        // Persist to localStorage
        useEffect(() => {
          try {
            localStorage.setItem(LOCAL_STORAGE_TASKS_KEY, JSON.stringify(tasks));
            localStorage.setItem(LOCAL_STORAGE_SUBTASKS_KEY, JSON.stringify(subtasks));
          } catch {}
        }, [tasks, subtasks]);

        useEffect(() => {
          if (tasks.length === 0) {
            setSelectedTaskId(null);
            return;
          }
          if (!selectedTaskId || !tasks.some((t) => t.id === selectedTaskId)) {
            setSelectedTaskId(tasks[0].id);
          }
        }, [tasks, selectedTaskId]);

        useEffect(() => {
          setConfirmDelete(false);
          setEditingSubtaskId(null);
          setIsEditingDate(false);
        }, [selectedTaskId]);

        // Keyboard shortcuts
        useEffect(() => {
          const onKey = (e) => {
            const tag = e.target?.tagName;
            const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
            if (e.key === 'Escape') {
              setIsTaskModalOpen(false);
              setIsBackupModalOpen(false);
              setIsMobileDrawerOpen(false);
              return;
            }
            if (isInput) return;
            if (e.key === '/' || (e.ctrlKey && e.key.toLowerCase() === 'k')) {
              e.preventDefault();
              searchInputRef.current?.focus();
            } else if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey) {
              e.preventDefault();
              openNewTaskModal('pendiente', todayIso);
            }
          };
          window.addEventListener('keydown', onKey);
          return () => window.removeEventListener('keydown', onKey);
        }, [todayIso]);

        const filteredTasks = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          const list = tasks.filter((t) => {
            if (activeFilter === 'trabajo' && t.category !== 'trabajo') return false;
            if (activeFilter === 'examen' && t.category !== 'examen') return false;
            if (activeFilter === 'diario' && t.category !== 'diario') return false;
            if (activeFilter === 'entregas' && t.status === 'terminado') return false;
            if (q && !`${t.title} ${t.subtitle} ${t.tag} ${t.category}`.toLowerCase().includes(q)) return false;
            return true;
          });
          return [...list].sort((a, b) => {
            if (sortBy === 'progreso' && b.progress !== a.progress) return b.progress - a.progress;
            if (sortBy === 'titulo') {
              const c = a.title.localeCompare(b.title, 'es');
              if (c !== 0) return c;
            }
            if (a.dueDate !== b.dueDate) return a.dueDate.localeCompare(b.dueDate);
            return a.title.localeCompare(b.title, 'es');
          });
        }, [tasks, activeFilter, searchQuery, sortBy]);

        const selectedTask = useMemo(
          () => tasks.find((t) => t.id === selectedTaskId) || null,
          [tasks, selectedTaskId]
        );

        const selectedTaskSubtasks = useMemo(
          () => subtasks.filter((s) => s.taskId === selectedTaskId).sort((a, b) => a.sortOrder - b.sortOrder),
          [subtasks, selectedTaskId]
        );

        const counts = useMemo(() => ({
          todo: tasks.length,
          trabajo: tasks.filter((t) => t.category === 'trabajo').length,
          examen: tasks.filter((t) => t.category === 'examen').length,
          diario: tasks.filter((t) => t.category === 'diario').length,
          entregas: tasks.filter((t) => t.status !== 'terminado').length,
        }), [tasks]);

        const monthlySummary = useMemo(() => {
          const completedCount = tasks.filter((t) => t.status === 'terminado').length;
          const inProgressCount = tasks.filter((t) => t.status === 'en_marcha').length;
          const pendingCount = tasks.filter((t) => t.status === 'pendiente').length;
          const averageProgress = tasks.length === 0
            ? 0
            : Math.round(tasks.reduce((acc, t) => acc + t.progress, 0) / tasks.length);
          return { completedCount, inProgressCount, pendingCount, averageProgress };
        }, [tasks]);

        const weeklyDeliveriesCount = useMemo(() => {
          return tasks.filter((t) => {
            if (t.status === 'terminado') return false;
            const info = formatSpanishDate(t.dueDate, todayIso);
            return info.isThisWeek || info.isOverdue;
          }).length;
        }, [tasks, todayIso]);

        const priorityToday = useMemo(() => {
          const active = tasks.filter((t) => t.status !== 'terminado');
          if (active.length === 0) return null;
          const sorted = [...active].sort((a, b) => {
            const aT = a.dueDate === todayIso ? 0 : 1;
            const bT = b.dueDate === todayIso ? 0 : 1;
            if (aT !== bT) return aT - bT;
            return a.dueDate.localeCompare(b.dueDate);
          });
          const chosen = sorted[0];
          const subs = subtasks.filter((s) => s.taskId === chosen.id);
          const remainingSubtasks = subs.length > 0
            ? subs.filter((s) => !s.completed).length
            : Math.max(1, chosen.totalSubtasks - chosen.completedSubtasks);
          return { task: chosen, remainingSubtasks, isToday: chosen.dueDate <= todayIso };
        }, [tasks, subtasks, todayIso]);

        const calendarCells = useMemo(
          () => getCalendarMonthDays(calYear, calMonth, todayIso),
          [calYear, calMonth, todayIso]
        );

        const tasksByDate = useMemo(() => {
          const map = {};
          for (const t of filteredTasks) {
            if (!map[t.dueDate]) map[t.dueDate] = [];
            map[t.dueDate].push(t);
          }
          return map;
        }, [filteredTasks]);

        // Actions
        const handleSelectTask = (taskId) => {
          setSelectedTaskId(taskId);
          setIsMobileDrawerOpen(true);
        };

        const handleStatusChange = (taskId, newStatus) => {
          setTasks((prev) =>
            prev.map((t) => {
              if (t.id !== taskId) return t;
              const taskSubs = subtasks.filter((s) => s.taskId === taskId);
              const { progress, totalSubtasks, completedSubtasks } =
                newStatus === 'terminado' && taskSubs.length === 0
                  ? { progress: 100, totalSubtasks: 0, completedSubtasks: 0 }
                  : calculateTaskProgress(taskSubs, newStatus);
              return {
                ...t,
                status: newStatus,
                progress,
                totalSubtasks,
                completedSubtasks,
                tag: newStatus === 'terminado' ? 'Completado' : t.tag,
              };
            })
          );
        };

        useEffect(() => {
          const handleGlobalTouchMove = (e) => {
            if (!activeTouchTaskRef.current) {
              if (longPressTimerRef.current !== null && touchStartPosRef.current && e.touches[0]) {
                const dx = Math.abs(e.touches[0].clientX - touchStartPosRef.current.x);
                const dy = Math.abs(e.touches[0].clientY - touchStartPosRef.current.y);
                if (dx > 10 || dy > 10) {
                  clearLongPressTimer();
                }
              }
              return;
            }
            const touch = e.touches[0];
            if (!touch) return;
            if (e.cancelable) e.preventDefault();

            setTouchDragGhost({
              taskId: activeTouchTaskRef.current.id,
              title: activeTouchTaskRef.current.title,
              x: touch.clientX,
              y: touch.clientY,
            });

            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            const dropZone = targetEl?.closest('[data-drop-status]');
            const status = dropZone?.getAttribute('data-drop-status') || null;

            if (dragOverColumnRef.current !== status) {
              dragOverColumnRef.current = status;
              setDragOverColumn(status);
            }
          };

          const finishTouchDrag = () => {
            clearLongPressTimer();
            if (activeTouchTaskRef.current) {
              const taskId = activeTouchTaskRef.current.id;
              const targetStatus = dragOverColumnRef.current;
              if (targetStatus) {
                handleStatusChange(taskId, targetStatus);
              }
            }
            activeTouchTaskRef.current = null;
            dragOverColumnRef.current = null;
            touchStartPosRef.current = null;
            setDraggedTaskId(null);
            setDragOverColumn(null);
            setTouchDragGhost(null);
          };

          window.addEventListener('touchmove', handleGlobalTouchMove, { passive: false });
          window.addEventListener('touchend', finishTouchDrag);
          window.addEventListener('touchcancel', finishTouchDrag);

          return () => {
            window.removeEventListener('touchmove', handleGlobalTouchMove);
            window.removeEventListener('touchend', finishTouchDrag);
            window.removeEventListener('touchcancel', finishTouchDrag);
          };
        }, [subtasks]);

        const handleDateChange = (taskId, newDueDate) => {
          setTasks((prev) => prev.map((t) => (t.id === taskId ? { ...t, dueDate: newDueDate } : t)));
        };

        const handleToggleSubtask = (subtaskId) => {
          const targetSub = subtasks.find((s) => s.id === subtaskId);
          if (!targetSub) return;
          const parentTask = tasks.find((t) => t.id === targetSub.taskId);
          if (!parentTask) return;

          const nextCompleted = !targetSub.completed;
          const updatedSubs = subtasks
            .filter((s) => s.taskId === parentTask.id)
            .map((s) => (s.id === subtaskId ? { ...s, completed: nextCompleted } : s));

          const { progress, totalSubtasks, completedSubtasks } = calculateTaskProgress(updatedSubs, parentTask.status);
          const nextStatus =
            totalSubtasks > 0 && completedSubtasks === totalSubtasks
              ? 'terminado'
              : parentTask.status === 'terminado' && completedSubtasks < totalSubtasks
              ? 'en_marcha'
              : parentTask.status;

          setSubtasks((prev) =>
            prev.map((s) =>
              s.id === subtaskId
                ? { ...s, completed: nextCompleted, scheduleLabel: nextCompleted ? '' : s.scheduleLabel }
                : s
            )
          );
          setTasks((prev) =>
            prev.map((t) =>
              t.id === parentTask.id
                ? { ...t, status: nextStatus, progress, totalSubtasks, completedSubtasks }
                : t
            )
          );
        };

        const handleCycleSubtaskLabel = (subtaskId, nextLabel) => {
          setSubtasks((prev) => prev.map((s) => (s.id === subtaskId ? { ...s, scheduleLabel: nextLabel } : s)));
        };

        const handleEditSubtaskTitle = (subtaskId, newTitle) => {
          const trimmed = newTitle.trim();
          if (!trimmed) return;
          setSubtasks((prev) => prev.map((s) => (s.id === subtaskId ? { ...s, title: trimmed } : s)));
          setEditingSubtaskId(null);
        };

        const handleAddSubtask = (e) => {
          e.preventDefault();
          if (!selectedTask) return;
          const trimmed = newSubtaskTitle.trim();
          if (!trimmed) return;
          const existing = subtasks.filter((s) => s.taskId === selectedTask.id);
          const newSub = {
            id: makeSafeId('sub'),
            ownerId: 'demo-user',
            taskId: selectedTask.id,
            title: trimmed,
            completed: false,
            scheduleLabel: newSubtaskSchedule,
            sortOrder: existing.length + 1,
          };
          const nextSubs = [...existing, newSub];
          const { progress, totalSubtasks, completedSubtasks } = calculateTaskProgress(nextSubs, selectedTask.status);
          setSubtasks((prev) => [...prev, newSub]);
          setTasks((prev) =>
            prev.map((t) =>
              t.id === selectedTask.id ? { ...t, progress, totalSubtasks, completedSubtasks } : t
            )
          );
          setNewSubtaskTitle('');
        };

        const handleDeleteSubtask = (subtaskId) => {
          const targetSub = subtasks.find((s) => s.id === subtaskId);
          if (!targetSub) return;
          const remaining = subtasks.filter((s) => s.taskId === targetSub.taskId && s.id !== subtaskId);
          const parent = tasks.find((t) => t.id === targetSub.taskId);
          if (!parent) return;
          const { progress, totalSubtasks, completedSubtasks } = calculateTaskProgress(remaining, parent.status);
          setSubtasks((prev) => prev.filter((s) => s.id !== subtaskId));
          setTasks((prev) =>
            prev.map((t) =>
              t.id === parent.id ? { ...t, progress, totalSubtasks, completedSubtasks } : t
            )
          );
        };

        const handleDeleteTask = (taskId) => {
          setSubtasks((prev) => prev.filter((s) => s.taskId !== taskId));
          setTasks((prev) => prev.filter((t) => t.id !== taskId));
          setIsMobileDrawerOpen(false);
        };

        const openNewTaskModal = (status = 'pendiente', dueDate = todayIso) => {

          setModalDefaultStatus(status);
          setModalDefaultDueDate(dueDate || todayIso);
          setIsTaskModalOpen(true);

        const handleExportBackup = () => {
          const blob = new Blob(
            [JSON.stringify({ version: 1, exportedAt: new Date().toISOString(), tasks, subtasks }, null, 2)],
            { type: 'application/json' }
          );
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `enfoque-neojira-backup-${todayIso}.json`;
          a.click();
          URL.revokeObjectURL(url);

        const handleImportBackup = async (file) => {

        const renderInspectorContent = () => {

                <div className="flex items-end justify-between pt-1">

                    <p className="text-[11px] font-semibold opacity-75">Progreso</p>

                  </div>
                </div>

                <div className="w-full h-2 rounded-full bg-black/20 overflow-hidden">
                  <div

              </div>

              <div className="rounded-2xl bg-[#131822] border border-[#1F2737] p-4 space-y-3.5">
                <div className="flex items-center justify-between gap-2">
                  <div>
                    <p className="text-xs text-slate-400">Entrega / Fecha clave</p>

                  <button

                  >
                    <${CalendarIcon} className="w-3.5 h-3.5 text-[#FF6B4A]" />
                    <span>${dateInfo.shortLabel}</span>
                  </button>
                </div>

                ${isEditingDate && html`
                  <div className="pt-1 space-y-2">
                    <div className="grid grid-cols-4 gap-1.5">
                      ${[
                        { label: 'Hoy', iso: todayIso },
                        { label: 'Mañana', iso: addDaysIso(todayIso, 1) },
                        { label: '+3 días', iso: addDaysIso(todayIso, 3) },
                        { label: '+1 sem', iso: addDaysIso(todayIso, 7) },
                      ].map((p) => html`
                        <button
                          key=${p.label}
                          type="button"

                            handleDateChange(selectedTask.id, p.iso);
                            setIsEditingDate(false);
                          }}
                          className="py-1.5 px-2 rounded-lg text-[11px] font-medium bg-[#0B0E14] border border-[#242F46] text-slate-300 hover:text-white cursor-pointer"
                        >
                          ${p.label}
                        </button>
                      `)}
                    </div>
                    <input
                      type="date"
                      value=${selectedTask.dueDate}
                      onChange=${(e) => {
                        if (e.target.value) {
                          handleDateChange(selectedTask.id, e.target.value);
                          setIsEditingDate(false);
                        }
                      }}
                      className="w-full px-3 py-2 rounded-xl bg-[#0B0E14] border border-[#2A364F] text-xs text-white"
                    />
                  </div>
                `}

                <div className="grid grid-cols-3 gap-1.5 p-1 rounded-xl bg-[#0B0E14] border border-[#1E2638]">
                  ${['pendiente', 'en_marcha', 'terminado'].map((st) => html`
                    <button
                      key=${st}
                      type="button"
                      onClick=${() => handleStatusChange(selectedTask.id, st)}
                      className=${`py-1.5 px-2 rounded-lg text-xs font-medium transition-colors cursor-pointer ${
                        selectedTask.status === st
                          ? 'bg-[#222C40] text-white font-semibold'
                          : 'text-slate-400 hover:text-slate-200'
                      }`}
                    >
                      ${STATUS_LABELS[st]}
                    </button>
                  `)}
                </div>
              </div>

              <div className="rounded-2xl bg-[#131822] border border-[#1F2737] p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-xs font-semibold text-slate-300">
                    Pasos y subtareas (${selectedTask.completedSubtasks}/${selectedTask.totalSubtasks})
                  </h3>
                  <span className="text-[11px] text-slate-500">Toca para completar</span>
                </div>

                <ul className="divide-y divide-[#1E2638]">
                  ${selectedTaskSubtasks.map((sub) => html`
                    <li key=${sub.id} className="py-2.5 flex items-center justify-between gap-2 group">
                      ${editingSubtaskId === sub.id ? html`
                        <div className="flex items-center gap-1.5 flex-1">
                          <input
                            type="text"
                            value=${editingSubtaskText}
                            onChange=${(e) => setEditingSubtaskText(e.target.value)}
                            onKeyDown=${(e) => {
                              if (e.key === 'Enter') handleEditSubtaskTitle(sub.id, editingSubtaskText);
                              if (e.key === 'Escape') setEditingSubtaskId(null);
                            }}
                            autoFocus
                            className="flex-1 px-2.5 py-1.5 rounded-lg bg-[#0B0E14] border border-[#FF6B4A] text-xs text-white"
                          />
                          <button
                            type="button"
                            onClick=${() => handleEditSubtaskTitle(sub.id, editingSubtaskText)}
                            className="px-2.5 py-1.5 rounded-lg bg-[#FF6B4A] text-[#0B0E14] text-[11px] font-bold cursor-pointer"
                          >
                            OK
                          </button>
                        </div>
                      ` : html`
                        <button
                          type="button"
                          onClick=${() => handleToggleSubtask(sub.id)}
                          className="flex items-center gap-3 text-left flex-1 min-w-0 py-1 cursor-pointer"
                        >
                          <span className=${`w-5 h-5 rounded-full flex items-center justify-center shrink-0 ${
                            sub.completed ? 'bg-white text-[#0B0E14]' : 'border-2 border-slate-600'

                            ${sub.completed && html`<${Check} className="w-3.5 h-3.5 stroke-[3]" />`}
                          </span>
                          <span className=${`text-xs leading-snug ${

                        </button>
                        <div className="flex items-center gap-1 shrink-0">
                          ${!sub.completed && html`

                              type="button"
                              onClick=${() => handleCycleSubtaskLabel(sub.id, cycleScheduleLabel(sub.scheduleLabel))}

                                sub.scheduleLabel === 'En curso' || sub.scheduleLabel === 'Hoy'
                                  ? 'bg-[#FF6B4A]/20 text-[#FF6B4A]'
                                  : sub.scheduleLabel === 'Mañana'
                                  ? 'bg-amber-500/15 text-amber-300'
                                  : 'bg-[#1B2333] text-slate-400'

                              ${sub.scheduleLabel || '+ Cuándo'}

                          `}
                          <button

                              setEditingSubtaskText(sub.title);

                            className="p-1.5 rounded-lg text-slate-500 hover:text-slate-200 cursor-pointer"
                          >
                            <${Pencil} className="w-3 h-3" />
                          </button>
                          <button
                            type="button"
                            onClick=${() => handleDeleteSubtask(sub.id)}
                            className="p-1.5 rounded-lg text-slate-500 hover:text-rose-400 cursor-pointer"

                <form onSubmit=${handleAddSubtask} className="pt-2 space-y-2 border-t border-[#1E2638]">
                  <div className="flex items-center gap-2">

        return html`

                <nav className="space-y-1">

                <div className="pt-4 border-t border-[#1E2638] px-2 space-y-2.5">

                      <div className="rounded-2xl bg-[#131822] border border-[#1F2737] p-4 space-y-3">
                        <div className="flex items-center justify-between">
                          <h3 className="text-sm font-bold text-white font-display">
                            Entregas del ${formatSpanishDate(selectedCalDate, todayIso).fullDate}
                          </h3>
                          <button
                            type="button"
                            onClick=${() => openNewTaskModal('pendiente', selectedCalDate)}
                            className="px-3 py-1.5 rounded-xl bg-[#FF6B4A] text-[#0B0E14] text-xs font-semibold cursor-pointer"
                          >
                            + Añadir este día
                          </button>
                        </div>
                        ${(tasksByDate[selectedCalDate] || []).length === 0 ? html`
                          <p className="text-xs text-slate-500">Sin entregas para este día.</p>
                        ` : html`
                          <div className="space-y-2">
                            ${(tasksByDate[selectedCalDate] || []).map((t) => html`
                              <button
                                key=${t.id}
                                type="button"
                                onClick=${() => handleSelectTask(t.id)}
                                className="w-full flex items-center justify-between p-3 rounded-xl bg-[#0B0E14] border border-[#1E2638] hover:border-[#FF6B4A] text-left cursor-pointer"
                              >
                                <div>
                                  <p className="text-[11px] text-slate-400">${CATEGORY_LABELS[t.category]} · ${t.subtitle}</p>
                                  <p className="text-xs font-bold text-white">${t.title}</p>
                                </div>
                                <span className="text-xs font-mono-num font-semibold text-[#FF6B4A]">${t.progress} %</span>
                              </button>
                            `)}
                          </div>
                        `}
                      </div>
                    </div>
                  `}
                </div>

                ${touchDragGhost && html`
                  <div
                    aria-hidden="true"
                    style=${{
                      left: `${touchDragGhost.x}px`,
                      top: `${touchDragGhost.y}px`,
                      transform: 'translate(-50%, -65%) rotate(2deg)',
                    }}
                    className="fixed z-50 pointer-events-none w-60 max-w-[78vw] rounded-2xl p-3.5 bg-[#171E2E]/95 border-2 border-[#FF6B4A] shadow-2xl backdrop-blur-md"
                  >
                    <p className="text-[10px] font-semibold uppercase tracking-wider text-[#FF6B4A]">
                      ${dragOverColumn
                        ? `Soltar en: ${STATUS_LABELS[dragOverColumn]}`
                        : 'Arrastra a otra columna...'}
                    </p>
                    <p className="text-xs font-bold text-white font-display truncate mt-0.5">
                      ${touchDragGhost.title}
                    </p>
                  </div>
                `}
              </section>

              <!-- Right Inspector (Desktop) -->
              <aside className="hidden lg:block w-[360px] xl:w-[380px] shrink-0 bg-[#0F131C] border-l border-[#1E2638] p-5 overflow-y-auto">
                ${renderInspectorContent()}
              </aside>

              <!-- Mobile / Tablet Drawer -->
              ${isMobileDrawerOpen && selectedTask && html`
                <div
                  className="lg:hidden fixed inset-0 z-50 flex flex-col justify-end md:items-end bg-black/70 backdrop-blur-xs"
                  onClick=${(e) => { if (e.target === e.currentTarget) setIsMobileDrawerOpen(false); }}
                >
                  <div className="w-full md:max-w-md max-h-[88vh] md:max-h-full md:h-full rounded-t-3xl md:rounded-none md:rounded-l-3xl bg-[#0F131C] border-t md:border-l border-[#263044] px-4 pt-2 pb-8 overflow-y-auto shadow-2xl">
                    <div className="w-10 h-1.5 bg-slate-700 rounded-full mx-auto my-2 md:hidden" />
                    ${renderInspectorContent()}
                  </div>
                </div>
              `}
            </main>

            <!-- Create / Edit Modal -->
            ${isTaskModalOpen && html`
              <${TaskFormModal}
                editingTask=${editingTask}
                defaultStatus=${modalDefaultStatus}
                defaultDueDate=${modalDefaultDueDate || todayIso}
                todayIso=${todayIso}
                onClose=${() => setIsTaskModalOpen(false)}
                onSave=${(draft) => {
                  if (editingTask) {
                    setTasks((prev) =>
                      prev.map((t) => (t.id === editingTask.id ? { ...t, ...draft } : t))
                    );
                  } else {
                    const newTaskId = makeSafeId('task');
                    const subs = (draft.initialSubtasks || [])
                      .filter((s) => s.title.trim())
                      .map((s, i) => ({
                        id: makeSafeId(`sub-${i}`),
                        ownerId: 'demo-user',
                        taskId: newTaskId,
                        title: s.title.trim(),
                        completed: false,
                        scheduleLabel: s.scheduleLabel || 'En curso',
                        sortOrder: i + 1,
                      }));
                    const { progress, totalSubtasks, completedSubtasks } = calculateTaskProgress(subs, draft.status);
                    const newTask = {
                      id: newTaskId,
                      ownerId: 'demo-user',
                      title: draft.title.trim(),
                      subtitle: draft.subtitle.trim(),
                      category: draft.category,
                      status: draft.status,
                      dueDate: draft.dueDate,
                      tag: draft.tag.trim() || 'Entrega',
                      progress,
                      totalSubtasks,
                      completedSubtasks,
                    };
                    setTasks((prev) => [newTask, ...prev]);
                    setSubtasks((prev) => [...prev, ...subs]);
                    setSelectedTaskId(newTaskId);
                  }
                  setIsTaskModalOpen(false);
                }}
              />
            `}

            <!-- Backup & Device Transfer Modal -->
            ${isBackupModalOpen && html`
              <div
                className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4"
                onClick=${(e) => { if (e.target === e.currentTarget) setIsBackupModalOpen(false); }}
              >
                <div className="w-full max-w-md rounded-2xl bg-[#131822] border border-[#263044] p-6 space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-base font-extrabold text-white font-display">
                      Copia de Seguridad (PC, Tableta y Móvil)
                    </h2>
                    <button
                      type="button"
                      onClick=${() => setIsBackupModalOpen(false)}
                      className="p-2 rounded-xl text-slate-400 hover:text-white cursor-pointer"
                    >
                      <${X} className="w-4 h-4" />
                    </button>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed">
                    Tus cambios se guardan automáticamente en este dispositivo. Además, puedes exportar o importar un archivo <code>.json</code> para pasar tus tareas al instante entre tu teléfono, tableta y PC:
                  </p>
                  <div className="grid grid-cols-1 gap-2.5">
                    <button
                      type="button"
                      onClick=${handleExportBackup}
                      className="w-full flex items-center justify-center gap-2 rounded-xl bg-[#FF6B4A] text-[#0B0E14] font-bold text-xs py-3 px-4 cursor-pointer"
                    >
                      <${FileDown} className="w-4 h-4" />
                      <span>Exportar tareas (.json)</span>
                    </button>
                    <input
                      ref=${fileInputRef}
                      type="file"
                      accept=".json,application/json"
                      className="hidden"
                      onChange=${(e) => {
                        const f = e.target.files?.[0];
                        if (f) handleImportBackup(f);
                      }}
                    />
                    <button
                      type="button"
                      onClick=${() => fileInputRef.current?.click()}
                      className="w-full flex items-center justify-center gap-2 rounded-xl bg-[#1B2333] hover:bg-[#253047] text-white font-semibold text-xs py-3 px-4 cursor-pointer"
                    >
                      <${FileUp} className="w-4 h-4 text-emerald-400" />
                      <span>Importar copia de seguridad (.json)</span>
                    </button>
                    <button
                      type="button"
                      onClick=${handleResetDemo}
                      className="w-full flex items-center justify-center gap-2 rounded-xl bg-[#0B0E14] border border-[#1E2638] text-slate-400 hover:text-white text-xs py-2.5 px-4 cursor-pointer"
                    >
                      <${RotateCcw} className="w-3.5 h-3.5" />
                      <span>Restaurar tareas de ejemplo</span>
                    </button>
                  </div>
                </div>
              </div>
            `}
          </div>
        `;
      }

      function TaskFormModal({ editingTask, defaultStatus, defaultDueDate, todayIso, onClose, onSave }) {
        const [title, setTitle] = useState(editingTask?.title || '');
        const [subtitle, setSubtitle] = useState(editingTask?.subtitle || '');
        const [category, setCategory] = useState(editingTask?.category || 'trabajo');
        const [status, setStatus] = useState(editingTask?.status || defaultStatus);
        const [dueDate, setDueDate] = useState(editingTask?.dueDate || defaultDueDate || todayIso);
        const [tag, setTag] = useState(editingTask?.tag || 'Entrega');
        const [subtaskDrafts, setSubtaskDrafts] = useState([
          { title: 'Primer bloque / preparación', scheduleLabel: 'En curso' },
          { title: 'Práctica o desarrollo', scheduleLabel: 'Hoy' },
          { title: 'Repaso final y entrega', scheduleLabel: 'Mañana' },
        ]);
        const [error, setError] = useState('');

        return html`
          <div
            className="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4"
            onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}
          >
            <div className="w-full max-w-lg rounded-2xl bg-[#131822] border border-[#263044] p-5 sm:p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-lg font-extrabold text-white font-display">
                  ${editingTask ? 'Editar elemento' : 'Nuevo Trabajo, Examen o Tarea'}
                </h2>
                <button type="button" onClick=${onClose} className="p-2 rounded-xl text-slate-400 hover:text-white cursor-pointer">
                  <${X} className="w-4 h-4" />
                </button>
              </div>

              <form
                onSubmit=${(e) => {
                  e.preventDefault();
                  if (!title.trim() || !subtitle.trim()) {
                    setError('Completa el título y la asignatura o área.');
                    return;
                  }
                  onSave({ title, subtitle, category, status, dueDate, tag, initialSubtasks: subtaskDrafts });
                }}
                className="space-y-4"
              >
                ${error && html`
                  <div className="rounded-xl bg-rose-500/15 border border-rose-500/40 px-3.5 py-2 text-xs text-rose-300">
                    ${error}
                  </div>
                `}

                <div className="grid grid-cols-3 gap-2">
                  ${[
                    { id: 'trabajo', label: 'Trabajo' },
                    { id: 'examen', label: 'Examen' },
                    { id: 'diario', label: 'Día a día' },
                  ].map((cat) => html`
                    <button
                      key=${cat.id}
                      type="button"
                      onClick=${() => setCategory(cat.id)}
                      className=${`py-2 px-3 rounded-xl text-xs font-medium border cursor-pointer ${
                        category === cat.id
                          ? 'bg-[#FF6B4A]/20 border-[#FF6B4A] text-white font-semibold'
                          : 'bg-[#0B0E14] border-[#222B3D] text-slate-400'
                      }`}
                    >
                      ${cat.label}
                    </button>
                  `)}
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Título</label>
                    <input
                      type="text"
                      value=${title}
                      onChange=${(e) => setTitle(e.target.value)}
                      placeholder="Ej. Examen de Estadística"
                      autoFocus
                      className="w-full px-3.5 py-2.5 rounded-xl bg-[#0B0E14] border border-[#242F46] text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Asignatura o área</label>
                    <input
                      type="text"
                      value=${subtitle}
                      onChange=${(e) => setSubtitle(e.target.value)}
                      placeholder="Ej. Universidad · Aula B4"
                      className="w-full px-3.5 py-2.5 rounded-xl bg-[#0B0E14] border border-[#242F46] text-xs text-white"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Fecha límite</label>
                    <input
                      type="date"
                      value=${dueDate}
                      onChange=${(e) => setDueDate(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl bg-[#0B0E14] border border-[#242F46] text-xs text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Estado</label>
                    <select
                      value=${status}
                      onChange=${(e) => setStatus(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl bg-[#0B0E14] border border-[#242F46] text-xs text-white"
                    >
                      <option value="pendiente">Pendiente</option>
                      <option value="en_marcha">En marcha</option>
                      <option value="terminado">Terminado</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">Etiqueta</label>
                    <input
                      type="text"
                      value=${tag}
                      onChange=${(e) => setTag(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-xl bg-[#0B0E14] border border-[#242F46] text-xs text-white"
                    />
                  </div>
                </div>

                ${!editingTask && html`
                  <div className="space-y-2 pt-1">
                    <div className="flex items-center justify-between">
                      <label className="text-xs font-medium text-slate-300">Subtareas iniciales</label>
                      <button
                        type="button"
                        onClick=${() => setSubtaskDrafts((p) => [...p, { title: '', scheduleLabel: 'En curso' }])}
                        className="text-xs font-semibold text-[#FF6B4A] cursor-pointer"
                      >
                        + Añadir paso
                      </button>
                    </div>
                    <div className="space-y-2 max-h-40 overflow-y-auto">
                      ${subtaskDrafts.map((item, idx) => html`
                        <div key=${idx} className="flex items-center gap-2">
                          <input
                            type="text"
                            value=${item.title}
                            onChange=${(e) => {
                              const val = e.target.value;
                              setSubtaskDrafts((p) => p.map((s, i) => (i === idx ? { ...s, title: val } : s)));
                            }}
                            placeholder=${`Paso ${idx + 1}`}
                            className="flex-1 px-3 py-2 rounded-xl bg-[#0B0E14] border border-[#242F46] text-xs text-white"
                          />
                          <button
                            type="button"
                            onClick=${() => setSubtaskDrafts((p) => p.filter((_, i) => i !== idx))}
                            className="p-2 text-slate-500 hover:text-rose-400 cursor-pointer"
                          >
                            <${Trash2} className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      `)}
                    </div>
                  </div>
                `}

                <div className="flex items-center justify-end gap-2.5 pt-3 border-t border-[#1E2638]">
                  <button
                    type="button"
                    onClick=${onClose}
                    className="px-4 py-2.5 rounded-xl bg-[#1B2333] text-xs font-medium text-slate-200 cursor-pointer"
                  >
                    Cancelar
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2.5 rounded-xl bg-[#FF6B4A] text-[#0B0E14] font-semibold text-xs cursor-pointer"
                  >
                    ${editingTask ? 'Guardar cambios' : 'Crear y añadir'}
                  </button>
                </div>
              </form>
            </div>
          </div>
        `;
      }

      createRoot(document.getElementById('root')).render(html`<${App} />`);
    </script>
  </body>
</html>
